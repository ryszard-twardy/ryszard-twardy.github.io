<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Synthetic order lines with seeded defects highlighted</title>
  <style>
    .bg{fill:#1f2328}.hd{fill:#e6e9ec;font:600 26px 'IBM Plex Mono',Consolas,monospace}
    .c{fill:#c9cfd6;font:400 26px 'IBM Plex Mono',Consolas,monospace}
    .d{fill:#f3d9c9;font:400 26px 'IBM Plex Mono',Consolas,monospace}
    .rule{stroke:#3a4048;stroke-width:1}.mark{fill:#9a5330;opacity:.28}
    .lab{fill:#c9a48d;font:400 22px 'IBM Plex Mono',Consolas,monospace}
    .ttl{fill:#e6e9ec;font:500 30px 'IBM Plex Sans','Segoe UI',sans-serif}
    .sub{fill:#8a929b;font:400 22px 'IBM Plex Sans','Segoe UI',sans-serif}
  </style>
  <rect class="bg" width="1600" height="900"/>
  <text class="ttl" x="80" y="92">orders_raw.csv, shard 17 of 80</text>
  <text class="sub" x="80" y="128">seeded defects, highlighted</text>

  <!-- header -->
  <text class="hd" x="80"  y="210">order_id</text>
  <text class="hd" x="360" y="210">customer_id</text>
  <text class="hd" x="700" y="210">order_date</text>
  <text class="hd" x="1000" y="210">amount</text>
  <text class="hd" x="1280" y="210">market</text>
  <line class="rule" x1="80" y1="230" x2="1520" y2="230"/>

  <!-- rows -->
  <g transform="translate(0,0)">
    <text class="c" x="80" y="290">ORD-104211</text><text class="c" x="360" y="290">C-30177</text><text class="c" x="700" y="290">2025-03-14</text><text class="c" x="1000" y="290">129.90</text><text class="c" x="1280" y="290">DE</text>
  </g>
  <!-- duplicate order -->
  <rect class="mark" x="60" y="312" width="1480" height="52"/>
  <g><text class="d" x="80" y="350">ORD-104211</text><text class="d" x="360" y="350">C-30177</text><text class="d" x="700" y="350">2025-03-14</text><text class="d" x="1000" y="350">129.90</text><text class="d" x="1280" y="350">DE</text></g>
  <text class="lab" x="1380" y="350">duplicate</text>

  <g><text class="c" x="80" y="410">ORD-104212</text><text class="c" x="360" y="410">C-08840</text><text class="c" x="700" y="410">2025-03-14</text><text class="c" x="1000" y="410">48.50</text><text class="c" x="1280" y="410">AT</text></g>

  <!-- cents format -->
  <rect class="mark" x="980" y="432" width="200" height="52"/>
  <g><text class="c" x="80" y="470">ORD-104213</text><text class="c" x="360" y="470">C-11902</text><text class="c" x="700" y="470">2025-03-15</text><text class="d" x="1000" y="470">7290</text><text class="c" x="1280" y="470">NL</text></g>
  <text class="lab" x="1380" y="470">cents</text>

  <!-- orphan key -->
  <rect class="mark" x="340" y="492" width="300" height="52"/>
  <g><text class="c" x="80" y="530">ORD-104214</text><text class="d" x="360" y="530">C-99999</text><text class="c" x="700" y="530">2025-03-15</text><text class="c" x="1000" y="530">215.00</text><text class="c" x="1280" y="530">FR</text></g>
  <text class="lab" x="1380" y="530">orphan key</text>

  <!-- header row contamination -->
  <rect class="mark" x="60" y="552" width="1480" height="52"/>
  <g><text class="d" x="80" y="590">order_id</text><text class="d" x="360" y="590">customer_id</text><text class="d" x="700" y="590">order_date</text><text class="d" x="1000" y="590">amount</text><text class="d" x="1280" y="590">market</text></g>
  <text class="lab" x="1380" y="590">header row</text>

  <!-- type drift -->
  <rect class="mark" x="680" y="612" width="280" height="52"/>
  <g><text class="c" x="80" y="650">ORD-104215</text><text class="c" x="360" y="650">C-20415</text><text class="d" x="700" y="650">15/03/2025</text><text class="c" x="1000" y="650">64.00</text><text class="c" x="1280" y="650">PL</text></g>
  <text class="lab" x="1380" y="650">type drift</text>

  <g><text class="c" x="80" y="710">ORD-104216</text><text class="c" x="360" y="710">C-30177</text><text class="c" x="700" y="710">2025-03-16</text><text class="c" x="1000" y="710">89.90</text><text class="c" x="1280" y="710">DE</text></g>
  <line class="rule" x1="80" y1="740" x2="1520" y2="740"/>
  <text class="sub" x="80" y="800">illustrative rows; defect classes are the real ones the generator seeds</text>
</svg>
